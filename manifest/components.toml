license = "MIT"
uses = ["cpu-boost", "scene-load"]
native = "components/runtime/image-load/native/build.cmd"
installs = [
    ["out/image-load/ImageLoadPipeline.dll", "BepInEx/plugins/ImageLoadPipeline.dll"],
    ["out/image-load/ImageLoadWorkNative.bin", "BepInEx/plugins/ImageLoadWorkNative.bin"]
]
enable = [
    ["BepInEx/config/local.vam.imageloadpipeline.cfg", "ImageLoad", "SameFrameMemoryHits", "true"],
    ["BepInEx/config/local.vam.imageloadpipeline.cfg", "ImageLoad", "AsyncPreparation", "true"],
    ["BepInEx/config/local.vam.imageloadpipeline.cfg", "ImageLoad", "ParallelPixels", "true"],
    ["BepInEx/config/local.vam.imageloadpipeline.cfg", "ImageLoad", "ParallelCompression", "true"],
    ["BepInEx/config/local.vam.imageloadpipeline.cfg", "ImageLoad", "CrossImagePipeline", "true"],
    ["BepInEx/config/local.vam.imageloadpipeline.cfg", "ImageLoad", "NativeMipmaps", "true"],
    ["BepInEx/config/local.vam.imageloadpipeline.cfg", "ImageLoad", "AsyncCacheWrite", "true"],
    ["BepInEx/config/local.vam.imageloadpipeline.cfg", "ImageLoad", "HeadWaitMs", "5000"]
]
guard = "a stage whose VaM method is not found, or whose native part or CpuBoost is missing, stays off (logged); an image the native decoder does not take goes through VaM's own decoder"

  [component.managed]
  out = "ImageLoadPipeline.dll"
  unsafe = true
  sources = [
      "ImageLoadPipeline.cs", "ImageLoadAsync.cs", "ImageLoadPixels.cs", "ImageLoadCompression.cs", "CrossPipeline.cs",
      "CrossSelfCheck.cs", "OffMain.cs", "StageProfile.cs"
]
  references = [
      "BepInEx/core/BepInEx.dll", "BepInEx/core/0Harmony.dll", "VaM_Data/Managed/Assembly-CSharp.dll",
      "VaM_Data/Managed/ICSharpCode.SharpZipLib.dll",
      "VaM_Data/Managed/UnityEngine.dll", "VaM_Data/Managed/UnityEngine.CoreModule.dll",
      "VaM_Data/Managed/UnityEngine.UI.dll", "VaM_Data/Managed/UnityEngine.UIModule.dll",
      "VaM_Data/Managed/UnityEngine.ImageConversionModule.dll", "VaM_Data/Managed/UnityEngine.UnityWebRequestModule.dll"
]
