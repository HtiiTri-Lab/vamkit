# ---- runtime: the same picture and motion for less time per frame. Scene and image loading are not part of this. ----

[[component]]
id = "cpu-boost"
path = "components/runtime/cpu-boost"
summary = "VaM's character hot paths (CPU skinning, morphs, normals, soft vertices) in native code with the same bits, and the worker pool every native plugin shares"
license = "MIT"
native = "components/runtime/cpu-boost/native/build.cmd"
tests = [
    ["pwsh", "-NoProfile", "-File", "{repo}/components/runtime/cpu-boost/harness/run-skin.ps1"],
    ["pwsh", "-NoProfile", "-File", "{repo}/components/runtime/cpu-boost/harness/run-paths.ps1"],
    ["pwsh", "-NoProfile", "-File", "{repo}/components/runtime/cpu-boost/harness/run-patch.ps1"]
]
installs = [
    ["out/cpu-boost/VaMCpuBoost.dll", "BepInEx/plugins/VaMCpuBoost.dll"],
    ["out/cpu-boost/VaMCpuBoostNative.bin", "BepInEx/plugins/VaMCpuBoostNative.bin"]
]
guard = "each method is patched only when its IL fingerprint is the one checked offline; any other is left to VaM (logged). harness/ runs the checks against the user's VaM"

  [component.managed]
  out = "VaMCpuBoost.dll"
  unsafe = true
  sources = ["plugin/VaMCpuBoost.cs", "plugin/CpuBoostSkin.cs", "plugin/CpuBoostPaths.cs"]
  references = [
      "BepInEx/core/BepInEx.dll", "BepInEx/core/0Harmony.dll", "VaM_Data/Managed/Assembly-CSharp.dll",
      "VaM_Data/Managed/UnityEngine.CoreModule.dll", "VaM_Data/Managed/UnityEngine.dll"
]

[[component]]
id = "gc-tuning"
path = "components/runtime/gc-tuning"
summary = "Mono's collector: collects about half as often, marks on several threads, no collection chains while loading, and a fix for block headers on 4 GB boundaries"
license = "MIT"
native = "components/runtime/gc-tuning/native/build.cmd"
tests = [
    ["{python}", "-I", "{repo}/components/runtime/gc-tuning/tools/check_layout.py"],
    ["cmd", "/c", "{repo}/components/runtime/gc-tuning/tools/fo_test.cmd"],
    ["cmd", "/c", "{repo}/components/runtime/gc-tuning/tools/guard_test.cmd"]
]
installs = [
    ["out/gc-tuning/VaMGcTuning.dll", "BepInEx/plugins/VaMGcTuning.dll"],
    ["out/gc-tuning/VaMGcTuningNative.bin", "BepInEx/plugins/VaMGcTuningNative.bin"]
]
guard = "checks the bytes of the loaded mono.dll at every place it changes; any mismatch leaves the collector as it is (logged)"

  [component.managed]
  out = "VaMGcTuning.dll"
  unsafe = true
  sources = ["VaMGcTuning.cs"]
  references = [
      "BepInEx/core/BepInEx.dll", "VaM_Data/Managed/UnityEngine.dll", "VaM_Data/Managed/UnityEngine.CoreModule.dll"
]

