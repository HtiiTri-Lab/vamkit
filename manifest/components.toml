# The one definition of each component: where it lives, how it is built, what it needs, where the result goes.
# tools/vamkit reads this file; documents and other tools must not keep their own lists. Components are built in the
# order they appear here.
#
# from_vam: the component generates sources from the user's own VaM (VaM_Data/*.assets) at build time. Those files stay
#           in out/gen/ and are never committed.
# needs:    ids in manifest/thirdparty.toml (third_party/<id>, from `vamkit fetch`).
# uses:     other components whose sources or headers it reads.
# generate: Python scripts run first (`python -I`), in this order; they write to out/gen/.
# native:   a build.cmd (MSVC, or CMake inside it) that writes to out/<id>/.
# [component.managed]: a BepInEx plugin compiled with the C# 3.5 compiler (VaM's Mono) into out/<id>/<out>:
#           sources (from the component's folder), shared (from components/shared: lang/VamkitLang.cs for a plugin
#           that shows text), generated (from the repo root), references (from the VaM folder),
#           resources ([file, name] embedded), unsafe.
# tests:    command lines `vamkit test` runs, each must exit 0. {repo}, {python} and {csc} are filled in.
# installs: [built file, path under the VaM folder]. "vamkit/bin" files are swapped in by the launcher only while the
#           mod runs; "BepInEx/plugins" files stay installed. The render and shading plugins are inert without the
#           launcher's environment; the runtime plugins work whenever BepInEx loads (vanilla turns BepInEx off).
# enable:   [cfg, section, key, value] the install writes: plugins whose own default is off.
# guard:    what the component does on a VaM it was not made for (the project must not depend on one VaM build).

# ---- render: the frame's path from Unity to the display ----

[[component]]
id = "d3d11-proxy"
path = "components/render/d3d11-proxy"
summary = "D3D11On12 proxy beside VaM.exe (Unity's device on a D3D12 queue) and the desktop presenter (DLSS or FSR frame generation)"
license = "LGPL-3.0-or-later"
needs = ["ngx-sdk", "fsr-sdk"]
native = "components/render/d3d11-proxy/build.cmd"
installs = [["out/d3d11-proxy/d3d11.dll", "vamkit/bin/d3d11.dll"]]

[[component]]
id = "opencomposite"
path = "components/render/opencomposite"
summary = "OpenComposite with the VR compositor work: DLSS SR / RR / NR, XeSS and FSR upscaling, PT composition, UI and motion guides"
license = "GPL-3.0-only"
needs = ["ngx-sdk", "detours", "nis-sdk", "fsr1-sdk", "nvapi", "glm", "openxr-sdk", "vulkan-headers", "xess-sdk", "fsr-sdk"]
uses = ["rt-core"]
native = "components/render/opencomposite/build.cmd"
installs = [["out/opencomposite/openvr_api.dll", "vamkit/bin/openvr_api.dll"]]

[[component]]
id = "ofxr-dlssg"
path = "components/render/ofxr-dlssg"
summary = "OFXR Bridge OpenXR layer and tray with DLSS Frame Generation 2-4x and FSR frame generation 2x"
license = "LGPL-3.0-or-later"
needs = ["ngx-sdk", "openvr-headers", "fsr-sdk"]
native = "components/render/ofxr-dlssg/build.cmd"
installs = [
    ["out/ofxr-dlssg/OFXRBridgeTray.exe", "vamkit/bin/ofxr/OFXRBridgeTray.exe"],
    ["out/ofxr-dlssg/ofxr/ofxr_bridge.ini", "vamkit/bin/ofxr/ofxr/ofxr_bridge.ini"],
    ["out/ofxr-dlssg/ofxr/OFXR_vulkan_queue_layer.dll", "vamkit/bin/ofxr/ofxr/OFXR_vulkan_queue_layer.dll"],
    ["out/ofxr-dlssg/ofxr/XR_APILAYER_XRFrameBridge_diagnostic.dll", "vamkit/bin/ofxr/ofxr/XR_APILAYER_XRFrameBridge_diagnostic.dll"]
]

[[component]]
