# Everything `vamkit fetch` puts in third_party/<id>/ (never committed). Nothing of a vendor's is redistributed by
# this project: SDKs come from the vendor's own repository at a pinned commit, model runtimes from the vendor's public
# location or from the user.
#
# kind = "git":   url + commit. `sparse` limits what is downloaded, `layout` ([from, to]) what is kept and where.
# kind = "nuget": package + version from nuget.org; `layout` as above.
# kind = "file":  url + sha256, saved as `name`.
# kind = "user":  no public download. `vamkit fetch --file <id>=<path>` checks the user's copy by sha256; `find` lists
#                 places on the user's own machine where the file may already be.
# terms = "accept": the vendor's licence applies; fetch names it and needs --accept-licenses.
# suggest: where people usually get a file that has no public download.
# installs: where `vamkit install` puts a runtime inside the VaM folder.
# Run-time files (items with `installs` and `signer`): sha256 is the version the project was developed with, not the
#   only one taken. A file with a valid signature of `signer` and a version of at least `min_version` is taken too, and
#   every report says which version is in use. `find` are places where the vendor's own software keeps such files;
#   `without` is what the user does not get while the file is missing: fetch, doctor, install and verify say it, with
#   the way to add the file. A missing file is never passed over in silence.
# only = "lab": needed for the test tools under tools/lab alone; fetched with `vamkit fetch --lab` or by id.

