; VaM 头发预算（BepInEx\plugins\VaMHairBudget.dll）。保存后约 1 秒内生效，不用重启 VaM。
; 只改渲染与物理实际读取的数值；VaM 滑块、场景和预设文件里仍是原值，存档不受影响。
; 开销 = 头皮三角面片数 × hairMultiplier × (curveDensity + 25) × 24/49 段（实测：每根发丝比它的段数多花约 25 段；
; curveDensity 24 的头发开销正好等于段数）。每只眼、每个渲染通道都要画一遍。
; 超出预算时，只把“每面片开销”最高的头发降到同一水位；较便宜的头发和小件（不到预算 5%）保持原样。
; 日志：BepInEx\LogOutput.log 里搜 “VaM hair budget”。

[HairBudget]
; Off 不修改 | High 只压极端值 | Balanced 均衡 | Performance 性能 | Custom 使用下面 [Custom] 段
; 档位          每人上限  场景上限  单件密度上限  物理迭代上限
; High          120万段   300万段   2048          3
; Balanced      60万段    150万段   1024          2
; Performance   35万段    80万段    640           2
Profile=Balanced
; 1 = 头发不投射阴影（每盏开阴影的灯都要把头发再画一遍，点光源 6 遍）；0 = 保持原样
DisableShadows=0
; 运行中临时关闭/恢复（对比画质用），留空为不用。例：ctrl+shift+h、f9
ToggleKey=ctrl+shift+h
; 游戏内“头发预算”页放在哪：MainMenu 主菜单 | UserPrefs 用户首选项 | None 不加（改后重启 VaM 生效）
MenuTab=MainMenu

[Custom]
; 每个人物所有头发的开销上限，单位千段（开销段，见开头）；0 = 不限
PersonBudgetK=600
; 整个场景上限，千段；0 = 不限
SceneBudgetK=1500
; 单件头发 hairMultiplier × curveDensity 的上限（兜底，只拦极端值）；0 = 不限
DensityMax=1024
; 降低时的下限（curveDensity 另外至少保留引导发丝段数的 3/4，有卷发时每个卷至少 6 个点）
CurveDensityMin=12
HairMultiplierMin=4
; 物理迭代次数上限（VaM 滑块 1～5）；0 = 不限
IterationsMax=2
; hairMultiplier 降低时发丝加宽以保持覆盖，最多加宽到原来的几倍；1 = 不加宽
WidthCompensation=1.5

[HairPhysics]
; 头发物理速率设置：VaM“物理速率设置”（Physics Rate / Physics Update Cap）的一份副本，只作用于物理头发。
; 碰撞、软体、布料等其余物理仍按 VaM 自己的设置。规则和 VaM 相同：每步 1/速率 秒，一帧最多推进 步长×上限（不超过 50 毫秒）。
; Rate：VaM = 跟随身体物理（默认：和身体同样的步数和步长，头皮蒙皮后推进）| Auto = 自动（同 VaM：头显刷新率，高于 91 Hz 时减半）| 45 | 60 | 72 | 80 | 90 | 120 | 144 | 240 | 288
Rate=VaM
; UpdateCap：头发物理更新上限 1～3（同 VaM 的物理更新上限）
UpdateCap=1