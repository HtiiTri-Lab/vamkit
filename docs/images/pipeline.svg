<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif" role="img" aria-label="What vamkit adds to a frame of VaM">
<title>What vamkit adds to a frame of VaM</title>
<rect width="1000" height="420" rx="10" fill="#0d1218"/>
<text x="24" y="36" font-size="17" fill="#e7ecf3" font-weight="bold" text-anchor="start">What vamkit adds to a frame of VaM</text>
<rect x="24" y="86" width="124" height="78" rx="8" fill="#141b24" stroke="#2a3545"/>
<text x="86.0" y="120.0" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="middle">VaM</text>
<text x="86.0" y="138.0" font-size="11" fill="#8f9bb0" font-weight="normal" text-anchor="middle">Unity · D3D11</text>
<rect x="162" y="86" width="124" height="78" rx="8" fill="#1d4d39" stroke="#3ecf8e"/>
<text x="224.0" y="120.0" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="middle">New shading</text>
<text x="224.0" y="138.0" font-size="11" fill="#8f9bb0" font-weight="normal" text-anchor="middle">skin · hair · clothing</text>
<rect x="300" y="60" width="124" height="58" rx="8" fill="#141b24" stroke="#2a3545"/>
<text x="362.0" y="93.0" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="middle">VaM's lighting</text>
<rect x="300" y="132" width="124" height="58" rx="8" fill="#1d4d39" stroke="#3ecf8e"/>
<text x="362.0" y="156.0" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="middle">Path tracing</text>
<text x="362.0" y="174.0" font-size="11" fill="#8f9bb0" font-weight="normal" text-anchor="middle">switched in game</text>
<text x="362.0" y="129" font-size="10" fill="#8f9bb0" font-weight="normal" text-anchor="middle">one or the other</text>
<rect x="438" y="86" width="124" height="78" rx="8" fill="#1d4d39" stroke="#3ecf8e"/>
<text x="500.0" y="111.0" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="middle">Upscaling</text>
<text x="500.0" y="129.0" font-size="11" fill="#8f9bb0" font-weight="normal" text-anchor="middle">DLSS · XeSS · FSR</text>
<text x="500.0" y="147.0" font-size="11" fill="#8f9bb0" font-weight="normal" text-anchor="middle">RR with path tracing</text>
<rect x="576" y="86" width="124" height="78" rx="8" fill="#1d4d39" stroke="#3ecf8e"/>
<text x="638.0" y="120.0" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="middle">Denoising</text>
<text x="638.0" y="138.0" font-size="11" fill="#8f9bb0" font-weight="normal" text-anchor="middle">DLSS NR</text>
<rect x="714" y="86" width="124" height="78" rx="8" fill="#1d4d39" stroke="#3ecf8e"/>
<text x="776.0" y="120.0" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="middle">Frame generation</text>
<text x="776.0" y="138.0" font-size="11" fill="#8f9bb0" font-weight="normal" text-anchor="middle">DLSS 2–4× · FSR 2×</text>
<rect x="852" y="86" width="124" height="78" rx="8" fill="#141b24" stroke="#2a3545"/>
<text x="914.0" y="120.0" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="middle">Headset</text>
<text x="914.0" y="138.0" font-size="11" fill="#8f9bb0" font-weight="normal" text-anchor="middle">or monitor</text>
<line x1="148" y1="125.0" x2="157" y2="125.0" stroke="#8f9bb0" stroke-width="1.5"/>
<path d="M162 125.0 l-7 -4 v8 z" fill="#8f9bb0"/>
<line x1="286" y1="125.0" x2="295" y2="89" stroke="#8f9bb0" stroke-width="1.5"/>
<path d="M300 89 l-7 -4 v8 z" fill="#8f9bb0"/>
<line x1="286" y1="125.0" x2="295" y2="161" stroke="#8f9bb0" stroke-width="1.5"/>
<path d="M300 161 l-7 -4 v8 z" fill="#8f9bb0"/>
<line x1="424" y1="89" x2="433" y2="125.0" stroke="#8f9bb0" stroke-width="1.5"/>
<path d="M438 125.0 l-7 -4 v8 z" fill="#8f9bb0"/>
<line x1="424" y1="161" x2="433" y2="125.0" stroke="#8f9bb0" stroke-width="1.5"/>
<path d="M438 125.0 l-7 -4 v8 z" fill="#8f9bb0"/>
<line x1="562" y1="125.0" x2="571" y2="125.0" stroke="#8f9bb0" stroke-width="1.5"/>
<path d="M576 125.0 l-7 -4 v8 z" fill="#8f9bb0"/>
<line x1="700" y1="125.0" x2="709" y2="125.0" stroke="#8f9bb0" stroke-width="1.5"/>
<path d="M714 125.0 l-7 -4 v8 z" fill="#8f9bb0"/>
<line x1="838" y1="125.0" x2="847" y2="125.0" stroke="#8f9bb0" stroke-width="1.5"/>
<path d="M852 125.0 l-7 -4 v8 z" fill="#8f9bb0"/>
<rect x="24" y="224" width="952" height="42" rx="8" fill="#141b24" stroke="#2a3545"/>
<rect x="24" y="224" width="6" height="42" rx="3" fill="#3ecf8e"/>
<text x="46" y="250" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="start">Runs cheaper</text>
<text x="156" y="250" font-size="12" fill="#8f9bb0" font-weight="normal" text-anchor="start">hair and cloth physics in fused GPU passes · character updates in native code · collector stalls of 0.7 s down to 0.16 s</text>
<rect x="24" y="276" width="952" height="42" rx="8" fill="#141b24" stroke="#2a3545"/>
<rect x="24" y="276" width="6" height="42" rx="3" fill="#3ecf8e"/>
<text x="46" y="302" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="start">Loads faster</text>
<text x="156" y="302" font-size="12" fill="#8f9bb0" font-weight="normal" text-anchor="start">compiled plugins cached · asset bundles and images decoded in parallel · a large scene ready in 53 s, not 167 s</text>
<rect x="24" y="328" width="952" height="42" rx="8" fill="#141b24" stroke="#2a3545"/>
<rect x="24" y="328" width="6" height="42" rx="3" fill="#3ecf8e"/>
<text x="46" y="354" font-size="13" fill="#e7ecf3" font-weight="bold" text-anchor="start">Reversible</text>
<text x="156" y="354" font-size="12" fill="#8f9bb0" font-weight="normal" text-anchor="start">the launcher starts the mod or vanilla VaM, in VR or on the desktop, and puts VaM's own files back on exit</text>
<text x="24" y="394" font-size="11" fill="#8f9bb0" font-weight="normal" text-anchor="start">The figures are from one test PC: RTX 5090 D (32 GB), Ryzen 9 9950X3D2, 128 GB RAM. Yours will differ.</text>
</svg>
